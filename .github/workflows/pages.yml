name: Deploy Rule Studio UI to GitHub Pages

# Builds the React UI in demo mode (no backend) and publishes it to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI deps
        working-directory: ui
        run: npm ci

      - name: Build UI (demo mode, Pages base path)
        working-directory: ui
        env:
          VITE_DEMO: "1"
          # Must match "/<repo-name>/" so assets resolve on Pages.
          VITE_BASE: "/${{ github.event.repository.name }}/"
        run: npm run build

      - name: Add SPA 404 fallback
        run: cp ui/dist/index.html ui/dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ui/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
